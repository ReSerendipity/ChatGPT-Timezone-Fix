name: Release

# §10.1 远端优先 / §10.2 tag 驱动：发布链只在远端由 tag 推动触发，本地不打包、不上传。
# 本仓为 Chrome/Edge MV3 浏览器扩展，唯一产物是 scripts/package.py 打出的
# dist/chatgpt-timezone-fix-<version>.zip（版本取自 manifest.json 顶层 version）。
# 该脚本仅用 Python 标准库，可在 ubuntu-latest 上原样运行，无需本机专有环境。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # §10.2 版本位须多点一致，漂一处即判红：tag 必须形如 vMAJOR.MINOR.PATCH，
      # 且其版本号与本仓唯一权威版本位 manifest.json 顶层 version 完全一致。
      - name: Validate tag format and version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v1.0.0)."
            exit 1
          fi
          tag_version="${TAG#v}"
          manifest_version="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match manifest.json version ($manifest_version)."
            exit 1
          fi
          echo "OK: tag $TAG matches manifest.json version $manifest_version"

      # §10.1 本地不打包：扩展 zip 在远端 runner 上用 scripts/package.py（纯标准库）构建。
      - name: Build extension zip
        run: python scripts/package.py

      # §10.1 产物可校验：Release 资产须附 SHA256SUMS.txt（防传输损坏）。
      # 不使用 GPG 分离签名（2026-10-18 裁决，§10.1 / §10.6）。
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # §10.2 远端建 draft Release，人工审核后再发布；命名取不可变 SemVer tag，
      # 不引入 floating latest。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "$TAG"

      - name: Upload release assets (zip + SHA256SUMS.txt)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt
